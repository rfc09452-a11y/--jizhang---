<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef3f8;--card:#fff;--text:#182230;--muted:#667085;--line:#dde5ef;

}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;color:var(--text);padding:22px;
  background:
    radial-gradient(circle at 12% 8%,rgba(79,110,247,.16),transparent 28%),
    radial-gradient(circle at 88% 14%,rgba(24,169,153,.14),transparent 26%),
    linear-gradient(180deg,#f8fbff 0%,var(--bg) 46%,#f7f9fc 100%)
}
.app{max-width:1120px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:14px 16px;border:1px solid rgba(255,255,255,.8);border-radius:14px;background:rgba(255,255,255,.72);box-shadow:var(--shadow);backdrop-filter:blur(10px)}.top h1{font-size:26px;color:var(--text);letter-spacing:0}.top h1:after{content:"工作台";font-size:12px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:999px;padding:3px 9px;margin-left:9px;vertical-align:middle}.badge{font-size:12px;color:var(--p);background:#fff;border:1px solid #dce4ff;border-radius:999px;padding:5px 12px;font-weight:700;box-shadow:0 3px 10px rgba(79,110,247,.08)}.summaryBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.summaryPill{font-size:12px;color:#475467;background:#fff;border:1px solid #e4e9f5;border-radius:999px;padding:5px 11px;font-weight:800}.summaryPill b{color:var(--green);margin-left:4px}
.card{position:relative;background:rgba(255,255,255,.92);border:1px solid rgba(220,229,239,.9);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--p),var(--p2),var(--amber));opacity:.9}.title{font-weight:800;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.title:before{content:"";width:8px;height:8px;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:50%;box-shadow:0 0 0 4px rgba(79,110,247,.12)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}input,textarea,select{border:1.5px solid var(--line);border-radius:9px;background:#fbfdff;outline:none;font:inherit;transition:border-color .16s,box-shadow .16s,background .16s}input,select{height:36px;padding:0 10px}textarea{padding:10px;resize:vertical}input:hover,textarea:hover,select:hover{background:#fff}input:focus,textarea:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(79,110,247,.12);background:#fff}.preset{display:flex;gap:6px;flex-wrap:wrap}.preset button,.btn{height:36px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:0 12px;cursor:pointer;font-weight:700;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s,color .12s}.preset button{height:30px;font-size:12px;padding:0 9px}.btn:hover,.preset button:hover{border-color:var(--p);box-shadow:var(--shadow2);transform:translateY(-1px)}.preset button.active{background:linear-gradient(135deg,var(--p),#6a82ff);border-color:transparent;color:#fff;box-shadow:var(--shadow2)}.btn.primary{background:linear-gradient(135deg,var(--p),#6a82ff);border-color:transparent;color:#fff}.btn.green{background:linear-gradient(135deg,var(--green),#20c997);border-color:transparent;color:#fff}.btn.danger{color:var(--red);background:#fff7f7;border-color:#ffd7d7}.preview{height:40px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#f5f7ff,#ecfbf8);border:1px solid #dfe8ff;border-radius:10px;padding:0 13px;color:var(--muted);font-size:13px;font-weight:700}.preview b:first-child{color:var(--red)}.preview b:last-child{color:var(--green);font-size:15px}.rateGroup{width:100%;font-size:12px;color:#344054;font-weight:800;margin-top:6px;padding-top:4px}.rateGroup:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--p2);margin-right:6px;vertical-align:1px}.settlePanel{background:linear-gradient(180deg,#fbfcff,#f6fbff);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;display:grid;grid-template-columns:minmax(170px,1fr) minmax(210px,1.2fr) minmax(210px,1.2fr) minmax(250px,1.4fr);gap:12px;align-items:start;margin-bottom:10px}.settlePanel .field{min-width:0}.settlePanel input{width:100%!important}.settlePanel .preset{min-height:30px}.settlePanel .btn{height:28px;font-size:12px;padding:0 9px;align-self:flex-start}.miniActions{display:flex;gap:6px;flex-wrap:wrap}.miniActions .btn{flex:1;min-width:86px}.settlePanel .preview{height:100%;min-height:86px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}.customRate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.customRate input{height:32px;font-size:12px}.linkPanel{background:linear-gradient(180deg,#fbfcff,#f7fbff);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;display:grid;grid-template-columns:180px 1fr 1fr auto auto;gap:8px;align-items:end;margin-top:10px}.linkPanel textarea{min-height:68px}.hint{font-size:12px;color:var(--muted)}
.tableWrap{border:1px solid var(--line);border-radius:11px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th{background:linear-gradient(180deg,#f8fafc,#f2f6fb);color:#596579;font-size:12px;font-weight:800;border-bottom:1px solid var(--line);padding:10px;position:sticky;top:0;z-index:1}td{border-bottom:1px solid #edf0f3;padding:10px}tbody tr{transition:background .14s}tbody tr:hover{background:#f8fbff}th.r,td.r{text-align:right}th.c,td.c{text-align:center}.profit{color:var(--green);font-weight:800}.cost{color:var(--red);font-weight:800}.empty{text-align:center;color:#98a2b3;padding:38px}.foot td{font-weight:800;background:#f8f9ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}.modal.open{display:flex}.box{background:#fff;border-radius:14px;width:min(760px,96vw);max-height:88vh;overflow:auto;padding:16px;box-shadow:0 24px 70px rgba(15,23,42,.24)}.boxHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.boxHead h2{font-size:18px}.rateGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rateList{white-space:pre-wrap;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#f8fbff;font-size:12px;line-height:1.65}
@media(max-width:760px){body{padding:10px}.top{border-radius:12px}.top h1{font-size:22px}.row{align-items:stretch}.field{width:100%}.field input,.field select{width:100%!important}.preview{width:100%;justify-content:space-between}.settlePanel{grid-template-columns:1fr}.settlePanel .preview{min-height:56px}.tableWrap{overflow:auto}table{min-width:860px}.rateGrid{grid-template-columns:1fr}.actions .btn{flex:1}.linkPanel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>记账</h1><div class="summaryBar"><span class="summaryPill">今日利润 <b id="sumProfit">0.00</b></span><span class="summaryPill">花费 <b id="sumCost">0.00</b></span><span class="summaryPill">收入 <b id="sumIncome">0.00</b></span><span class="badge" id="countTop">0 条</span></div></div>
  <div class="card">
    <div class="title">添加记录</div>
    <div class="row">
      <div class="field"><label>时间</label><input type="time" id="time" step="60" style="width:110px"></div>
      <div class="field" style="min-width:280px;flex:1"><label>花费</label><div class="preset" id="costPreset"><button data-v="50">50</button><button data-v="100">100</button><button data-v="200">200</button><button data-v="348">348</button><button data-v="648">648</button><button data-v="1000">1000</button><input type="number" id="cost" placeholder="自定义" step="0.01" min="0" style="width:95px"></div></div>
      <div class="field"><label>收入</label><input type="number" id="income" placeholder="0.00" step="0.01" min="0" style="width:130px"></div>
      <button class="btn primary" id="add">添加</button><button class="btn" id="copyLast">复制上一条</button><button class="btn" id="cancelEdit" style="display:none">取消修改</button>
    </div>
    <div class="row">
      <div class="field" style="min-width:360px;flex:1"><label>成本费率 <button class="btn" id="rateMgr" style="height:24px;padding:0 8px;font-size:12px">管理</button></label><div class="preset" id="rates"></div><div class="customRate"><input type="text" id="customRateName" placeholder="抽奖/代刷" style="width:110px"><input type="number" id="customRateValue" placeholder="自定义费率" step="0.001" min="0" style="width:110px"><button class="btn" id="useCustomRate" style="height:32px;padding:0 10px;font-size:12px">使用自定义</button></div></div>
    </div>
    <div class="settlePanel">
      
      <div class="field"><label>手续费</label><input type="number" id="feeInput" placeholder="例如 0.6" step="0.1" min="0"><div class="preset" id="feePreset"></div><div class="miniActions"><button class="btn" id="saveFee">保存手续费</button><button class="btn danger" id="deleteFee">删除手续费</button></div></div>
      <div class="field"><label>返利率</label><input type="number" id="rebateRate" placeholder="例如 1.6" step="0.1" min="0" max="100"><div class="preset" id="rebateRatePreset"></div><div class="miniActions"><button class="btn" id="saveRebateRate">保存返利率</button><button class="btn danger" id="deleteRebateRate">删除返利率</button></div></div>
      <div class="field"><label>返利基数</label><input type="number" id="rebateBase" placeholder="金额" step="1" min="0"><div class="preset" id="rebateBasePreset"></div><div class="miniActions"><button class="btn" id="saveRebateBase">保存基数</button><button class="btn danger" id="deleteRebateBase">删除基数</button></div></div>
      <div class="preview">成本 <b id="totalCost">0.00</b> 手续费 <b id="feeCost">0.00</b> 利润 <b id="profitNow">0.00</b></div>
    </div>
    <div class="linkPanel">
      <div class="field"><label>返利链接</label><select id="rebateSelect"><option value="">不选择</option></select></div>
      <div class="field"><label><span style="color:var(--red)">*</span> 返利链接备注</label><input type="text" id="linkName" placeholder="返利链接备注个名称"></div>
      <div class="field"><label><span style="color:var(--red)">*</span> 返利链接</label><textarea id="linkText" placeholder="填写返利链接"></textarea></div>
      <button class="btn" id="saveLink">存档链接</button>
      <button class="btn danger" id="deleteLink">删除链接</button>
    </div>
    <div class="linkPanel">
      <div class="field"><label>选择备注</label><select id="noteSelect"><option value="">不选择</option></select></div>
      <div class="field" style="grid-column:span 2"><label>备注内容</label><input type="text" id="plainNote" placeholder="填写常用备注"></div>
      <button class="btn" id="saveNote">保存备注</button>
      <button class="btn danger" id="deleteNote">删除备注</button>
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center"><div class="title" style="margin:0">记录列表</div><span class="badge" id="count">0 条</span></div>
    <div class="row" style="background:#f8f9ff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px"><div class="preset" id="dayFilter"><button class="active" data-d="0">今天</button><button data-d="1">昨天</button><button data-d="2">前天</button><button data-d="custom">自选</button></div><input type="number" id="customDay" placeholder="天前" min="0" max="365" style="width:76px;height:30px"><select id="groupFilter" style="height:30px"><option value="">全部小组</option><option value="星悦">星悦</option><option value="梦想">梦想</option><option value="小刀">小刀</option><option value="小刀2">小刀2</option><option value="自定义">自定义</option></select><select id="sortOrder" style="height:30px"><option value="asc">时间升序</option><option value="desc">时间降序</option></select><span class="hint" id="filterHint"></span></div>
    <div class="tableWrap"><table><thead><tr><th class="c">#</th><th class="c">日期</th><th class="c">时间</th><th class="r">花费</th><th class="r">扣分</th><th class="c">费率</th><th class="r">收入</th><th class="r">利润</th><th class="r">返利率</th><th class="r">返利</th><th class="c">返利备注</th><th class="c">链接</th><th></th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
    <div class="actions"><button class="btn green" id="doc">导出 Word</button><button class="btn" id="xls">导出 Excel</button><button class="btn" id="json">导出 JSON</button><button class="btn" id="copyRebate">复制返利汇总</button><button class="btn" id="importBtn">导入 JSON</button><input type="file" id="importFile" accept=".json" style="display:none"><button class="btn danger" id="clear">清空当前筛选</button></div>
  </div>
</div>
<div class="modal" id="rateModal"><div class="box"><div class="boxHead"><h2>管理费率</h2><button class="btn" id="closeRate">关闭</button></div><div class="rateGrid"><textarea id="rateInput" rows="14" placeholder="必须写分组，例如：&#10;【星宇】&#10;普通:0.875&#10;加速:0.88&#10;&#10;【微信】&#10;通额:0.88"></textarea><div class="rateList" id="ratePreview"></div></div><div class="actions"><button class="btn primary" id="saveRates">保存费率</button><button class="btn green" id="saveSnapshot">保存时间快照</button><button class="btn danger" id="deleteSnapshot">删除快照</button><button class="btn" id="resetRates">恢复默认</button><select id="snapshotSelect" style="height:36px;min-width:150px"><option value="">选择快照</option></select><span class="hint" id="rateStatus"></span></div><div class="hint" id="snapshotList" style="margin-top:8px;white-space:pre-wrap"></div></div></div>
<script>
(function(){
var K="ld10",RK="rdb10",BASE="ldBase",LINKK="rebateLinksV1",RRK="rebateRatePresetsV1",RBK="rebateBasePresetsV1",TSK="rateSnapshotsV1",NOTEK="notePresetsV1",FEEK="feeRatePresetsV1";
var defRates=[
{g:"星悦",items:[["普通","0.895"],["加速","0.9"],["超速","0.905"],["极速","0.91"],["火箭","0.915"],["秒拉","0.92"],["直拉","0.93"],["怪额","0.95"],["单端","0.915"],["通额","0.88"],["速额","0.89"],["固额","0.865"],["小额","0.84"],["点额","0.82"],["扫码通额","0.895"],["扫码固额","0.87"],["扫码小额","0.85"]]},
{g:"小刀",items:[["普通","0.895"],["加速","0.9"],["超速","0.905"],["极速","0.91"],["火箭","0.915"],["秒拉","0.92"],["超快","0.93"],["怪额","0.95"],["微信","0.89"],["微100","0.87"],["小额10起","0.84"]]},
{g:"梦想",items:[["普通","0.895"],["加速","0.9"],["超速","0.905"],["极速","0.91"],["火箭","0.915"],["秒拉","0.92"],["超快","0.93"],["怪额","0.95"],["微信","0.89"],["小额","0.84"]]},
{g:"小刀2",items:[["普通","0.895"],["加速","0.9"],["超速","0.905"],["极速","0.91"],["火箭","0.915"],["秒拉","0.92"],["超快","0.93"],["怪额","0.95"],["小刀微信100","0.885"],["小刀微信100起","0.87"],["小刀微信200","0.89"],["小刀微信50","0.86"],["小刀微信10起","0.84"],["微信通额","0.875"],["微信速额","0.89"]]}
];
var entries=safeJson(localStorage.getItem(K),[]),rates=loadRates(),links=loadLinks(),notePresets=loadNotes(),rebateRates=loadNumberList(RRK,["0.5","1","1.6","2","3.2","3.6","3.8"]),rebateBases=loadNumberList(RBK,["50","100","198","348","648","988"]),feePresets=loadNumberList(FEEK,["0","0.6","1.6"]),selectedRate=firstRate(),feeRate=0,editingIndex=null;
function $(id){return document.getElementById(id)}
function safeJson(s,f){try{return s?JSON.parse(s):f}catch(e){return f}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return dateStr(new Date())}
function nowTimeStr(){return new Date().toTimeString().slice(0,5)}
function nowStamp(){var d=new Date();return dateStr(d)+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")}
function offsetDateStr(days){var d=new Date();d.setDate(d.getDate()-days);return dateStr(d)}
function entryDate(e){if(e.ds)return e.ds;if(e.date)return e.date;if(!e.ca)return "";var d=new Date(e.ca);return isNaN(d.getTime())?"":dateStr(d)}
function fmt(n){return (Math.round((parseFloat(n)||0)*100)/100).toFixed(2)}
function mergeRateTemplate(saved){var old=normalizeRates(saved),byGroup={},byName={};old.forEach(function(g){(g.items||[]).forEach(function(it){var val=it[1] == null ? "" : String(it[1]);if(val==="")return;var key=normalizeGroupName(g.g)+"|"+it[0];byGroup[key]=val;byName[it[0]]=val})});return defRates.map(function(g){return{g:g.g,items:g.items.map(function(it){var key=g.g+"|"+it[0],v=Object.prototype.hasOwnProperty.call(byGroup,key)?byGroup[key]:(Object.prototype.hasOwnProperty.call(byName,it[0])?byName[it[0]]:it[1]);return[it[0],v]})}})}
function hasBuiltInGroups(r){var names=(r||[]).map(function(g){return g.g}).join("|");return names.indexOf("星悦")>=0&&names.indexOf("梦想")>=0&&names.indexOf("小刀")>=0&&names.indexOf("小刀2")>=0}
function loadRates(){var saved=safeJson(localStorage.getItem(RK),null)||safeJson(localStorage.getItem(BASE),null);var r=mergeRateTemplate(saved);localStorage.setItem(RK,JSON.stringify(r));localStorage.setItem(BASE,JSON.stringify(r));return r}
function normalizeRates(r){if(!Array.isArray(r)||!r.length)return clone(defRates);if(Array.isArray(r[0]))return[{g:"默认",items:r}];return r.filter(function(g){return g&&g.g&&Array.isArray(g.items)&&g.items.length}).map(function(g){return{g:g.g,items:g.items.map(function(it){return[it[0],it[1] == null ? "" : String(it[1])]})}})}
function firstRate(){var g=rates[0]||defRates[0];return (g.items&&g.items[0])||["普通",""]}
function saveRatesData(r){rates=mergeRateTemplate(r);localStorage.setItem(RK,JSON.stringify(rates));localStorage.setItem(BASE,JSON.stringify(rates))}
function loadSnapshots(){var a=safeJson(localStorage.getItem(TSK),[]);return Array.isArray(a)?a:[]}
function saveSnapshots(a){a.sort(function(x,y){return x.time.localeCompare(y.time)});localStorage.setItem(TSK,JSON.stringify(a))}
function renderSnapshots(){var el=$("snapshotList"),sel=$("snapshotSelect");var a=loadSnapshots();if(el)el.textContent=a.length?"已存快照："+a.map(function(x){return x.time}).join("、"):"暂无时间快照";if(sel){var cur=sel.value;sel.innerHTML="<option value=\"\">选择快照</option>"+a.map(function(x){return "<option value=\""+x.time+"\">"+x.time+"</option>"}).join("");sel.value=cur}}
function findRate(group,name){for(var gi=0;gi<rates.length;gi++){if(rates[gi].g!==group)continue;for(var ii=0;ii<rates[gi].items.length;ii++){if(rates[gi].items[ii][0]===name)return[rates[gi].items[ii][0],rates[gi].items[ii][1],rates[gi].g]}}return null}
function applySnapshotData(hit){var keepGroup=selectedRate&&selectedRate[2],keepName=selectedRate&&selectedRate[0];if(hit&&hit.rates){rates=mergeRateTemplate(hit.rates);selectedRate=findRate(keepGroup,keepName)||[rates[0].items[0][0],rates[0].items[0][1],rates[0].g];renderRates();return true}return false}
function applyLastSnapshot(){var a=loadSnapshots();return a.length?applySnapshotData(a[a.length-1]):false}
function applyRatesForTime(t){var a=loadSnapshots(),hit=null;if(!t)return applyLastSnapshot();a.forEach(function(s){if(s.time<=t)hit=s});return applySnapshotData(hit)}
function sortNumberList(a){return a.map(function(v){return String(v)}).filter(function(v,i,self){return v!==""&&self.indexOf(v)===i}).sort(function(a,b){return parseFloat(a)-parseFloat(b)})}
function loadNumberList(key,defaults){var a=safeJson(localStorage.getItem(key),defaults);if(!Array.isArray(a))a=defaults;return sortNumberList(a)}
function saveNumberList(key,a){localStorage.setItem(key,JSON.stringify(a))}
